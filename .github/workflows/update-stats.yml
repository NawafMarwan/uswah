name: Update social views

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 06:17 Riyadh time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch views
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL: ${{ vars.YOUTUBE_CHANNEL }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ vars.X_USERNAME }}
        run: python3 scripts/fetch_stats.py
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "uswah-stats-bot"
          git config user.email "uswah-stats-bot@users.noreply.github.com"
          git add data/stats.json uswah.html index.html
          git commit -m "تحديث بيانات المشاهدات $(date -u +%F)"
          git push
