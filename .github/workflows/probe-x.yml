name: Probe X (free options)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public endpoints (no browser)
        run: python3 scripts/probe_x.py OSWAHH1
      - name: Probe headless browser
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python3 scripts/probe_x_browser.py OSWAHH1
