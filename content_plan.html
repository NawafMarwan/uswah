  --ink:#f6ece6; --ink-2:#d9c7cf; --muted:#a8949f; --line:#44303f; --line-2:#56404f;
  --plum:#4a2c45; --copper:#d9874f; --copper-ink:#e59a66; --slate:#8fb0c4; --taupe:#c2a28f;
  --logo-filter:brightness(0) invert(.94);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.8;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
@media (min-width:768px){:root{--gutter:28px}}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.logo{background:var(--logo) center/contain no-repeat}
.theme-logo{filter:var(--logo-filter)}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:40px;height:44px;flex:none}
.brand b{font-size:15px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.2;white-space:nowrap}
.brand-text{line-height:1.3}
.icon-btn{margin-inline-start:auto;appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#3a2236 0%,#4d2f48 62%,#5c3550 100%);color:#fffaf6}
.hero .shape{position:absolute;inset-inline-start:-60px;top:-70px;width:300px;height:300px;border-radius:50%;border:44px solid rgba(194,112,61,.28)}
.hero .shape2{position:absolute;inset-inline-end:-40px;bottom:-90px;width:230px;height:230px;border-radius:50%;border:30px solid rgba(110,143,163,.22)}
.hero .wrap{position:relative;padding-block:38px 44px}
.kicker{display:inline-block;color:#e8a77a;font-weight:600;font-size:14px;letter-spacing:.02em}
.hero h1{margin:4px 0 6px;font-size:clamp(28px,5vw,44px);line-height:1.3;font-weight:700}
.hero p{margin:0;color:#e5d3cc;max-width:560px;font-size:15.5px}
.hero .meta{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.pillbox{background:rgba(255,250,246,.12);border:1px solid rgba(255,250,246,.22);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:500}
.pillbox b{font-weight:700}

main{padding-block:26px 56px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px clamp(14px,2.4vw,24px);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{margin:0;font-size:18px}
.panel-h p{margin:0;font-size:13px;color:var(--muted)}
.empty-state{text-align:center;color:var(--muted);font-size:14.5px;padding:24px}

.next-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ncard{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--surface-2);border-inline-start:4px solid var(--c,var(--copper))}
.ncard .nd{font-size:13px;color:var(--muted);font-weight:500}
.ncard .nt{margin-top:4px;font-weight:600;line-height:1.6;font-size:15px}
.ncard .np{margin-top:6px;font-size:12.5px;color:var(--c,var(--copper-ink));font-weight:600;display:flex;align-items:center;gap:6px}
.ncard .np i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--copper));display:inline-block}

.plan-tools{display:grid;gap:10px;margin:20px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);min-height:36px}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--bg)}

.pweek{margin-top:22px}
.pweek h3{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
.pweek h3::after{content:"";flex:1;height:1px;background:var(--line)}
.pday{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.pday:last-child{border-bottom:0}
.pdate{text-align:center;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:8px 4px;align-self:start}
.pdate b{display:block;font-size:22px;line-height:1.2}
.pdate span{display:block;font-size:12px;color:var(--muted)}
.pday.today .pdate{background:var(--plum);border-color:var(--plum)}
.pday.today .pdate b,.pday.today .pdate span{color:var(--on-brand)}
.pday.past{opacity:.62}
.pitems{display:grid;gap:8px;min-width:0}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;border-inline-start:4px solid var(--c,var(--copper))}
.pitem .pt{font-weight:600;line-height:1.6;font-size:15px}
.pitem .pp{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.pitem.note{background:transparent;border-style:dashed;color:var(--ink-2)}
.todaytag{display:inline-block;margin-inline-start:6px;background:var(--copper);color:#fff;font-size:11.5px;padding:0 8px;border-radius:999px;font-weight:600}
@media (max-width:560px){.pday{grid-template-columns:58px 1fr;gap:10px}.pdate b{font-size:19px}}

footer{background:#2a1b28;color:#e5d3cc;text-align:center;padding:34px 16px 30px}
footer .logo{width:64px;height:70px;margin:0 auto 8px;filter:brightness(0) invert(1)}
footer p{margin:0;font-size:14px}
footer a{color:#e8a77a;text-decoration:none;font-weight:600}
footer small{display:block;margin-top:10px;color:#a8949f;font-size:12.5px}

@media print{.topbar,.plan-tools,footer{display:none}.hero{background:none;color:#000}.hero p,.kicker,.pillbox{color:#000}.pday.past{opacity:1}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="logo theme-logo" role="img" aria-label="شعار أسوة"></span>
      <span class="brand-text"><b>مركز أسوة</b><small>للسيرة النبوية</small></span>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path id="themeIcon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </div>
</header>

<section class="hero">
  <div class="shape"></div><div class="shape2"></div>
  <div class="wrap">
    <span class="kicker">نتعلم.. لنتأسى</span>
    <h1>خطة نشر المحتوى</h1>
    <p id="heroSub">البرنامج الشهري لنشر محتوى مركز أسوة للسيرة النبوية.</p>
    <div class="meta" id="heroMeta"></div>
  </div>
</section>

<main>
  <div class="wrap">
    <section class="panel" id="planNext" hidden>
      <div class="panel-h"><h2>القادم في الخطة</h2><p>أقرب المواد المجدولة للنشر</p></div>
      <div class="next-grid" id="planNextGrid"></div>
    </section>
    <div class="plan-tools" id="planTools" hidden>
      <div class="chips" id="planMonths" role="group" aria-label="الشهر"></div>
      <div class="chips" id="planProjects" role="group" aria-label="المشروع"></div>
    </div>
    <div id="planBody"></div>
  </div>
</main>

<footer>
  <div class="logo" role="img" aria-label="أسوة — نتعلم.. لنتأسى"></div>
  <p>مركز أسوة للسيرة النبوية · <a href="mailto:info@uswah.sa">info@uswah.sa</a></p>
  <small>© <span class="num" id="year"></span> مركز أسوة للسيرة النبوية</small>
</footer>

<!-- Baseline data. scripts/fetch_stats.py rewrites this block from data/plan.json. -->
<script id="seed" type="application/json">{"updated":"2026-10-27","projects":["اقتباسات الشمائل","اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","اقتباسات أهمية السيرة","الكتب الصوتية","القصائد والمنظومات","الدورات القصيرة","خُطب أسوة"],"items":[{"date":"2026-08-30","project":"اقتباسات الشمائل","title":"أسبوع الإنطلاقة","kind":"note"},{"date":"2026-09-07","project":"اقتباسات أهمية السيرة","title":"اقتباس أهمية السيرة النبوية1","kind":"quote"},{"date":"2026-09-08","project":"الكتب الصوتية","title":"تشويق الكتاب الصوتي الأول (بداية السول في تفضيل الرسول)","kind":"teaser"},{"date":"2026-09-09","project":"الكتب الصوتية","title":"نشر الكتاب الصوتي الأول (بداية السول في تفضيل الرسول)","kind":"release"},{"date":"2026-09-10","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام1","kind":"quote"},{"date":"2026-09-14","project":"اقتباسات الشمائل","title":"اقتباس الشمائل1","kind":"quote"},{"date":"2026-09-17","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام2","kind":"quote"},{"date":"2026-09-20","project":"اقتباسات أهمية السيرة","title":"اقتباس أهمية السيرة النبوية2","kind":"quote"},{"date":"2026-09-21","project":"القصائد والمنظومات","title":"تشويق قصيدة (دار الحبيب)","kind":"teaser"},{"date":"2026-09-23","project":"القصائد والمنظومات","title":"نشر قصيدة (دار الحبيب)","kind":"release"},{"date":"2026-09-24","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام3","kind":"quote"},{"date":"2026-09-27","project":"اقتباسات الشمائل","title":"اقتباس الشمائل 2","kind":"quote"},{"date":"2026-09-29","project":"القصائد والمنظومات","title":"مقطع ترويجي لقصيدة (دار الحبيب)","kind":"promo"},{"date":"2026-10-01","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام4","kind":"quote"},{"date":"2026-10-04","project":"اقتباسات أهمية السيرة","title":"اقتباس أهمية السيرة النبوية 3","kind":"quote"},{"date":"2026-10-05","project":"الكتب الصوتية","title":"تشويق الكتاب الصوتي الثاني (الشمائل المحمدية)","kind":"teaser"},{"date":"2026-10-07","project":"الكتب الصوتية","title":"نشر الكتاب الصوتي الثاني (الشمائل المحمدية)","kind":"release"},{"date":"2026-10-08","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام5","kind":"quote"},{"date":"2026-10-11","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الشمائل 3","kind":"quote"},{"date":"2026-10-13","project":"الكتب الصوتية","title":"مقطع ترويجي لكتاب (الشمائل المحمدية)","kind":"promo"},{"date":"2026-10-15","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام6","kind":"quote"},{"date":"2026-10-18","project":"اقتباسات أهمية السيرة","title":"اقتباس أهمية السيرة النبوية 4","kind":"quote"},{"date":"2026-10-22","project":"اقتباسات الصلاة على النبي ( عليه الصلاة والسلام)","title":"اقتباس الصلاة على النبي عليه الصلاة والسلام7","kind":"quote"}]}</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 864e5;
const toDay = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const fromDay = n => new Date(n * DAY).toISOString().slice(0, 10);
const todayDay = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY; };
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')) && !isNaN(toDay(s));
const dfDayY = new Intl.DateTimeFormat('ar-u-nu-latn-ca-gregory', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const dfDay = new Intl.DateTimeFormat('ar-u-nu-latn-ca-gregory', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const dfWeekday = new Intl.DateTimeFormat('ar-u-nu-latn', { weekday: 'long', timeZone: 'UTC' });
const dfMonthName = new Intl.DateTimeFormat('ar-u-nu-latn-ca-gregory', { month: 'long', year: 'numeric', timeZone: 'UTC' });
const fmtDay = (n, y) => (y ? dfDayY : dfDay).format(new Date(n * DAY));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const PLAN_COLORS = ['#c2703d', '#8a3f8c', '#2a6fb8', '#16967a', '#c4512f', '#6e8fa3', '#9a7c6a'];
let plan = null;
const state = { month: '', project: 'all' };
const color = name => PLAN_COLORS[Math.max(0, plan.projects.indexOf(name)) % PLAN_COLORS.length];
const weekStart = d => d - (new Date(d * DAY).getUTCDay() % 7); // weeks start on Sunday

function load(j) {
  if (j && Array.isArray(j.items) && Array.isArray(j.projects)) {
    plan = { updated: j.updated || '', projects: j.projects, items: j.items.filter(i => validDate(i.date)) };
  }
}

function render() {
  const body = $('#planBody');
  if (!plan || !plan.items.length) {
    $('#planTools').hidden = true; $('#planNext').hidden = true; $('#heroMeta').innerHTML = '';
    body.innerHTML = '<div class="panel"><div class="empty-state">لم تُنشر خطة المحتوى بعد</div></div>';
    return;
  }
  const items = plan.items;
  const t = todayDay();
  const real = items.filter(i => i.kind !== 'note');
  // hero meta
  const upcoming = real.filter(i => toDay(i.date) >= t).length;
  $('#heroMeta').innerHTML =
    `<span class="pillbox">المواد المجدولة: <b class="num">${real.length}</b></span>` +
    (upcoming ? `<span class="pillbox">القادمة: <b class="num">${upcoming}</b></span>` : '') +
    (plan.updated ? `<span class="pillbox">آخر تحديث: <b>${fmtDay(toDay(plan.updated), true)}</b></span>` : '');
  // upcoming
  const next = real.filter(i => toDay(i.date) >= t).slice(0, 4);
  $('#planNext').hidden = !next.length;
  $('#planNextGrid').innerHTML = next.map(i => `<div class="ncard" style="--c:${color(i.project)}">
    <div class="nd">${dfWeekday.format(new Date(toDay(i.date) * DAY))} · ${fmtDay(toDay(i.date), true)}${toDay(i.date) === t ? '<span class="todaytag">اليوم</span>' : ''}</div>
    <div class="nt">${esc(i.title)}</div><div class="np"><i></i>${esc(i.project)}</div></div>`).join('');
  // months
  const months = [...new Set(items.map(i => i.date.slice(0, 7)))].sort();
  if (!months.includes(state.month)) {
    const cur = fromDay(t).slice(0, 7);
    state.month = months.includes(cur) ? cur : (months.find(m => m > cur) || months[months.length - 1]);
  }
  $('#planTools').hidden = false;
  $('#planMonths').innerHTML = months.map(m => `<button type="button" class="chip" data-month="${m}" aria-pressed="${m === state.month}">${dfMonthName.format(new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1, 1)))}</button>`).join('');
  $('#planProjects').innerHTML = `<button type="button" class="chip" data-project="all" aria-pressed="${state.project === 'all'}">كل المشاريع</button>` +
    plan.projects.map(p => `<button type="button" class="chip" data-project="${esc(p)}" aria-pressed="${p === state.project}"><span class="dot" style="background:${color(p)}"></span>${esc(p)}</button>`).join('');
  // body
  const shown = items.filter(i => i.date.startsWith(state.month) && (state.project === 'all' || i.project === state.project || i.kind === 'note'));
  const byDay = new Map();
  for (const i of shown) { const k = toDay(i.date); (byDay.get(k) || byDay.set(k, []).get(k)).push(i); }
  const days = [...byDay.keys()].sort((a, b) => a - b);
  if (!days.length) { body.innerHTML = '<div class="panel"><div class="empty-state">لا توجد مواد مجدولة لهذا الاختيار</div></div>'; return; }
  const weeks = new Map();
  for (const d of days) { const w = weekStart(d); (weeks.get(w) || weeks.set(w, []).get(w)).push(d); }
  let n = 0;
  body.innerHTML = [...weeks.entries()].map(([w, ds]) => {
    n++;
    return `<section class="pweek"><h3>الأسبوع ${n} · من ${fmtDay(w)}</h3>` + ds.map(d => `
      <div class="pday${d === t ? ' today' : ''}${d < t ? ' past' : ''}">
        <div class="pdate"><b class="num">${new Date(d * DAY).getUTCDate()}</b><span>${dfWeekday.format(new Date(d * DAY))}</span></div>
        <div class="pitems">${byDay.get(d).map(i => i.kind === 'note'
          ? `<div class="pitem note"><span class="pt">${esc(i.title)}</span></div>`
          : `<div class="pitem" style="--c:${color(i.project)}"><span class="pt">${esc(i.title)}</span><span class="pp">${esc(i.project)}</span></div>`).join('')}</div>
      </div>`).join('') + '</section>';
  }).join('');
}
$('#planMonths').addEventListener('click', e => { const b = e.target.closest('[data-month]'); if (b) { state.month = b.dataset.month; render(); } });
$('#planProjects').addEventListener('click', e => { const b = e.target.closest('[data-project]'); if (b) { state.project = b.dataset.project; render(); } });

/* theme */
const root = document.documentElement;
const SUN = 'M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z';
const MOON = 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z';
function applyTheme(t) {
  if (t) root.dataset.theme = t; else delete root.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeIcon').setAttribute('d', dark ? SUN : MOON);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1118' : '#3a2236';
}
applyTheme(store.get('uswah.theme', ''));
$('#themeBtn').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; store.set('uswah.theme', t); applyTheme(t);
});

/* boot */
$('#year').textContent = new Date().getFullYear();
try { load(JSON.parse($('#seed').textContent)); } catch {}
render();
// Prefer the live plan file when served over http(s) (e.g. GitHub Pages).
if (location.protocol.startsWith('http')) {
  fetch('data/plan.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { load(j); render(); }).catch(() => {});
}
})();
</script>
